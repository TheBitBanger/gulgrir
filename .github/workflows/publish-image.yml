name: Publish GHCR Image

on:
  push:
    tags:
      - "r*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g., r3)"
        required: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag and validate branch
        id: resolve
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" && -n "${INPUT_TAG}" ]]; then
            TAG="${INPUT_TAG}"
            git fetch --tags
            git checkout "tags/${TAG}"
          fi

          if [[ -z "${TAG}" ]]; then
            echo "No tag provided or detected."
            exit 1
          fi

          if [[ ! "${TAG}" =~ ^r[1-9][0-9]*$ ]]; then
            echo "Unsupported tag format: ${TAG}. Releases are tagged rN (r1, r2, ...)."
            exit 1
          fi

          git fetch --no-tags origin dev
          if ! git merge-base --is-ancestor HEAD origin/dev; then
            echo "Tag ${TAG} must point to a commit reachable from origin/dev."
            exit 1
          fi

          {
            echo "image_tags<<EOF"
            echo "ghcr.io/thebitbanger/gulgrir:dev"
            echo "ghcr.io/thebitbanger/gulgrir:${TAG}"
            echo "EOF"
            echo "revision=$(git rev-parse HEAD)"
          } >> "${GITHUB_OUTPUT}"

      - name: Smoke test the image
        run: make smoke-test-image

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/app/Dockerfile
          target: runtime
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.resolve.outputs.image_tags }}
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ steps.resolve.outputs.revision }}
