name: Publish GHCR Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g., v1.5 or v1.4.6)"
        required: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag and validate branch
        id: resolve
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" && -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
            git fetch --tags
            git checkout "tags/${TAG}"
          fi

          if [[ -z "${TAG}" ]]; then
            echo "No tag provided or detected."
            exit 1
          fi

          git fetch --no-tags origin dev master

          if [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            REQUIRED_BRANCH="origin/dev"
            {
              echo "image_tags<<EOF"
              echo "ghcr.io/thebitbanger/gulgrir:dev"
              echo "ghcr.io/thebitbanger/gulgrir:${TAG}"
              echo "EOF"
            } >> "${GITHUB_OUTPUT}"
          elif [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+$ ]]; then
            REQUIRED_BRANCH="origin/master"
            {
              echo "image_tags<<EOF"
              echo "ghcr.io/thebitbanger/gulgrir:latest"
              echo "ghcr.io/thebitbanger/gulgrir:${TAG}"
              echo "EOF"
            } >> "${GITHUB_OUTPUT}"
          else
            echo "Unsupported tag format: ${TAG}"
            echo "Use vX.Y.Z for dev or vX.Y for stable."
            exit 1
          fi

          if ! git branch -r --contains "${GITHUB_SHA}" | grep -q "${REQUIRED_BRANCH}"; then
            echo "Tag ${TAG} must point to a commit reachable from ${REQUIRED_BRANCH}."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/app.Dockerfile
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.resolve.outputs.image_tags }}
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}
