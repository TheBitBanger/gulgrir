{% extends "tracker/base.html" %}
{% block content %}
<h1 class="text-xl font-semibold mb-4">Delete {{ object }}</h1>
<p class="mb-4">Are you sure you want to delete this? This action cannot be undone.</p>

<form method="post">
  {% csrf_token %}
  <button type="submit" class="btn btn-danger">Delete</button>
  <a href="{{ success_url|default:request.META.HTTP_REFERER }}" class="btn">Cancel</a>
</form>
{% endblock %}
