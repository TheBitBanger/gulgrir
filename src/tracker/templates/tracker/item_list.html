{% extends "tracker/base.html" %}
{% block content %}
<h1 class="text-xl font-semibold mb-4">Library - Items</h1>

<a class="btn mb-2" href="{% url 'item_add' %}">Add item</a>

<table class="w-full border-collapse">
  <thead>
    <tr class="border-b">
      <th class="text-left p-1">Title</th>
      <th>Media type</th>
    </tr>
  </thead>
  <tbody>
    {% for itm in object_list %}
      <tr class="border-b">
        <td class="p-1">{{ itm.title }}</td>
        <td class="p-1">{{ itm.media_type }}</td>
      </tr>
    {% empty %}
      <tr><td colspan="2" class="p-2">No items yet.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
