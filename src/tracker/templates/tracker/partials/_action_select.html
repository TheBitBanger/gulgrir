<select id="action_select"
        name="action_slug"
        hx-get="{% url 'action_params' %}"
        hx-target="#param_zone"
        hx-trigger="load, change"
        hx-swap="innerHTML"
        class="control">
  {% for act in actions %}
    <option value="{{ act.slug }}">{{ act.label }}</option>
  {% endfor %}
</select>
