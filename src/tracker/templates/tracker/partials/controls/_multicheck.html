<div x-data="{open:false}" class="relative inline-block">
  <button type="button"
          @click="open = !open"
          @keydown.escape.window="open = false"
          class="control w-52 flex justify-between items-center">
    <span class="truncate">
      {% with sel=field.value %}
        {% if sel %}
          {{ label }} ({{ sel|length }})
        {% else %}
          {{ label }}
        {% endif %}
      {% endwith %}
    </span>
    <!-- chevron -->
    <svg class="w-4 h-4 ml-1" xmlns="http://www.w3.org/2000/svg" fill="none"
         viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round"
            stroke-width="2" d="M19 9l-7 7-7-7"/>
    </svg>
  </button>

  <div x-show="open"
       @click.outside="open = false"
       x-cloak
       class="dropdown-panel absolute z-10 mt-1 w-52 max-h-60 overflow-y-auto border rounded shadow-lg">
    {% with sel=field.value %}
      {% for value, label in field.field.choices %}
        <label class="flex items-center gap-2 px-2 py-1 whitespace-nowrap">
          <input type="checkbox"
                 name="{{ field.html_name }}"
                 value="{{ value }}"
                 {% if value|stringformat:"s" in sel %}checked{% endif %}>
          <span class="truncate">{{ label }}</span>
        </label>
      {% endfor %}
    {% endwith %}
  </div>
</div>
