{% extends "tracker/base.html" %}
{% block content %}
<h1 class="text-xl font-semibold mb-4">My queues</h1>

<a class="btn mb-2" href="{% url 'queue_add' %}">➕ New queue</a>

<table class="w-full border-collapse">
  <thead>
    <tr class="border-b"><th class="text-left p-1">Name</th><th>Position</th><th class="w-24"></th></tr>
  </thead>
  <tbody>
    {% for q in object_list %}
      <tr class="border-b">
        <td class="p-1">{{ q.name }}</td>
        <td class="text-center">{{ q.position }}</td>
        <td class="text-right">
          <a href="{% url 'queue_edit' q.pk %}">✏️</a>
        </td>
      </tr>
    {% empty %}
      <tr><td colspan="3" class="p-2">No queues yet.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
